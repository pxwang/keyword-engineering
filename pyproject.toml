[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Ruff's own defaults (E4, E7, E9, F) plus import sorting (I) and bugbear (B).
# E501 (line too long) is deliberately left out: argparse help strings in this
# project are long single lines by design, and wrapping them hurts readability
# more than it helps - this matches ruff's own default philosophy of not
# enabling E501, which is a style preference, not a correctness issue.
select = ["E4", "E7", "E9", "F", "I", "B"]
