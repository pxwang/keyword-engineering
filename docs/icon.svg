<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Clustered Keywords</title>
  <defs>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
      <stop offset="0%" stop-color="#C89B3C" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#C89B3C" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#C89B3C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- badge ground -->
  <rect x="0" y="0" width="512" height="512" rx="100" fill="#12181F" />
  <rect x="0" y="0" width="512" height="512" rx="100" fill="url(#glow)" />
  <rect x="6" y="6" width="500" height="500" rx="96" fill="none" stroke="#C89B3C" stroke-opacity="0.18" stroke-width="2" />

  <!-- embedding space: similarity ring shared by all clusters -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#C89B3C" stroke-width="10" />

  <g stroke="#C89B3C" stroke-linecap="round">
    <!-- spokes: hub keyword to each cluster's representative term -->
    <line x1="208" y1="208" x2="150" y2="150" stroke-width="10" />
    <line x1="304" y1="208" x2="362" y2="150" stroke-width="10" />
    <line x1="304" y1="304" x2="362" y2="362" stroke-width="10" />
    <line x1="208" y1="304" x2="150" y2="362" stroke-width="10" />
    <!-- four tight keyword clusters (triangles) seated on the ring -->
    <line x1="150" y1="150" x2="100" y2="151" stroke-width="7" />
    <line x1="100" y1="151" x2="151" y2="100" stroke-width="7" />
    <line x1="151" y1="100" x2="150" y2="150" stroke-width="7" />
    <line x1="362" y1="150" x2="361" y2="100" stroke-width="7" />
    <line x1="361" y1="100" x2="412" y2="151" stroke-width="7" />
    <line x1="412" y1="151" x2="362" y2="150" stroke-width="7" />
    <line x1="362" y1="362" x2="412" y2="361" stroke-width="7" />
    <line x1="412" y1="361" x2="361" y2="412" stroke-width="7" />
    <line x1="361" y1="412" x2="362" y2="362" stroke-width="7" />
    <line x1="150" y1="362" x2="151" y2="412" stroke-width="7" />
    <line x1="151" y1="412" x2="100" y2="361" stroke-width="7" />
    <line x1="100" y1="361" x2="150" y2="362" stroke-width="7" />
  </g>

  <!-- cluster nodes; the representative term (on the ring) is larger -->
  <g fill="#C89B3C">
    <circle cx="150" cy="150" r="17" />
    <circle cx="100" cy="151" r="12" />
    <circle cx="151" cy="100" r="12" />
    <circle cx="362" cy="150" r="17" />
    <circle cx="361" cy="100" r="12" />
    <circle cx="412" cy="151" r="12" />
    <circle cx="362" cy="362" r="17" />
    <circle cx="412" cy="361" r="12" />
    <circle cx="361" cy="412" r="12" />
    <circle cx="150" cy="362" r="17" />
    <circle cx="151" cy="412" r="12" />
    <circle cx="100" cy="361" r="12" />
  </g>

  <!-- hub -->
  <circle cx="256" cy="256" r="64" fill="#0A0D11" stroke="#C89B3C" stroke-width="8" />

  <!-- tag glyph as the hub, standing in for "keyword" -->
  <g fill="none" stroke="#EDE6D6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M216,256 L238,234 L296,234 L296,278 L238,278 Z" />
    <circle cx="236" cy="256" r="6" />
  </g>
</svg>
