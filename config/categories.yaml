# Industry categories used by keyword_classify.py to bucket keywords before clustering.
#
# The 31 category names started from a real ad-industry taxonomy rather than being
# invented from scratch, transcribed by hand (not fetched live - if the source taxonomy
# changes, this file goes stale until someone updates it). Everything else in this file
# - the hint phrases, the unknown_threshold, the whole YAML structure - is this
# project's own addition, not sourced externally.
#
# `hints` are example keyword-style phrases for each category, used to build a richer
# anchor embedding than the bare category name alone (a single short label like "Travel"
# doesn't carry enough signal to embed well against real keyword phrasing - see the
# project README for the concrete case this fixed: "hotel" was scoring higher on
# "Restaurants & Food" than "Travel" using the bare label alone). Add more hints to a
# category, or edit existing ones, to help it match your specific keyword data better.
#
# `unknown_threshold`: a keyword whose best category_sim falls below this value is
# labeled "Unknown" instead of being forced into its nearest (but poor) category match.
# 0.35 is a data-driven starting point (see README), not a universal constant - lower it
# to force more assignments, raise it to be more conservative about weak matches.

unknown_threshold: 0.35

